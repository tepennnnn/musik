# Builds every download for a release tag (e.g. v1.6.0) or manual workflow_dispatch run and attaches them
# to a GitHub release: Windows installer, macOS apps (Apple Silicon and Intel), Linux packages, Android APK,
# unsigned iOS IPA, and the Web PWA bundle.
#
# Optional repository secrets for persistent Android APK update signatures (Settings -> Secrets and variables -> Actions):
#   MUSIKE_KEYSTORE_BASE64    base64-encoded .jks keystore
#   MUSIKE_KEYSTORE_PASSWORD  MUSIKE_KEY_ALIAS  MUSIKE_KEY_PASSWORD
# When omitted, an ad-hoc keystore is generated so the built APK is still signed and installable.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v1.6.0). Leave empty for a build-only dry run."
        required: false
        default: ""
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Package Web PWA bundle
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          (cd web/dist && zip -qry "../../release/Musike-Web-${version}.zip" .)
          { echo "### Web PWA"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: release/*
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter musike-desktop dist
      - name: Check downloads
        shell: bash
        run: |
          { echo "### Windows"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-Windows.exe 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-Windows.exe, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  mac:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ad-hoc signed (no Apple Developer ID): enough to run on Apple Silicon; Gatekeeper asks once.
      - run: pnpm --filter musike-desktop dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check downloads
        shell: bash
        run: |
          { echo "### macOS"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-macOS-*.dmg 2>/dev/null | wc -l)
          [ "$found" -eq 2 ] || { echo "::error::Expected 2 file(s) matching *-macOS-*.dmg, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: release/*
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # AppImage and .deb, for x64 and arm64 (the arm64 ones are packaged here too: nothing is compiled).
      - run: pnpm --filter musike-desktop dist:linux
      - name: Check downloads
        shell: bash
        run: |
          { echo "### Linux"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-Linux-* 2>/dev/null | wc -l)
          [ "$found" -eq 4 ] || { echo "::error::Expected 4 file(s) matching *-Linux-*, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release/*
          if-no-files-found: error

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIKE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MUSIKE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSIKE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSIKE_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/musike-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            {
              echo "MUSIKE_KEYSTORE=$keystore"
              echo "MUSIKE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MUSIKE_KEY_ALIAS=$KEY_ALIAS"
              echo "MUSIKE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::MUSIKE_KEYSTORE_BASE64 is not set: generating an ad-hoc release keystore. Future updates will require uninstalling unless you configure a persistent keystore secret."
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -alias musike \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass musike -keypass musike \
              -dname "CN=Musik, OU=Release, O=Musik, L=Unknown, S=Unknown, C=US"
            {
              echo "MUSIKE_KEYSTORE=$keystore"
              echo "MUSIKE_KEYSTORE_PASSWORD=musike"
              echo "MUSIKE_KEY_ALIAS=musike"
              echo "MUSIKE_KEY_PASSWORD=musike"
            } >> "$GITHUB_ENV"
          fi
      - run: pnpm --filter @musike/mobile apk
      - name: Check downloads
        shell: bash
        run: |
          { echo "### Android"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-Android*.apk 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-Android*.apk, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: release/*
          if-no-files-found: error

  ios:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unsigned on purpose: AltStore, SideStore or Sideloadly sign it with the user's own Apple ID when installing.
      - run: pnpm --filter @musike/mobile ipa
      - name: Check downloads
        shell: bash
        run: |
          { echo "### iOS"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-iOS.ipa 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-iOS.ipa, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: release/*
          if-no-files-found: error

  release:
    needs: [verify, windows, mac, linux, android, ios]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: downloads
          merge-multiple: true
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          draft: ${{ inputs.draft == true }}
          generate_release_notes: true
          files: downloads/*
          fail_on_unmatched_files: true
